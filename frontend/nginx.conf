server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Recheck the application shell after releases; bundles use versioned filenames.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /50x.html;
}
