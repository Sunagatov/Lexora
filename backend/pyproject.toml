[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora-backend"
version = "0.1.0"
description = "FastAPI backend for Lexora"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "sqlalchemy>=2.1.8,<3.0.0",
    "psycopg[binary]>=3.3.8,<4.0.0",
    "alembic>=1.20.1,<2.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "anthropic>=2.6.0,<3.0.0",
    "openai>=3.46.0,<4.0.0",
    "python-multipart>=0.0.33,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "PyJWT>=2.15.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "ruff>=0.17.4,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
